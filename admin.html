<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestion des articles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        #login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8f9fa; }
        #admin-panel { display: none; }
        .editor-container { height: 300px; background: white; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="card p-4 shadow" style="width: 350px;">
            <h3 class="text-center mb-3">Connexion</h3>
            <input type="password" id="password-input" class="form-control mb-3" placeholder="Mot de passe">
            <button onclick="checkLogin()" class="btn btn-primary w-100">Entrer</button>
            <p class="text-danger mt-2 text-center" id="login-error" style="display:none;">Mot de passe incorrect</p>
        </div>
    </div>

    <div id="admin-panel" class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <h1>Rédaction d'Actu</h1>
            <div>
                <a href="index.html" class="btn btn-outline-secondary me-2">Voir le site</a>
                <button onclick="downloadJSON()" class="btn btn-success fw-bold">💾 SAUVEGARDER SUR PC</button>
            </div>
        </div>

        <div class="card mb-5 shadow-sm">
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label fw-bold">Titre de l'article</label>
                    <input type="text" id="article-title" class="form-control" placeholder="Titre accrocheur">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Image de couverture</label>
                        <input type="text" id="article-image" class="form-control" placeholder="image1.jpg (dans /img)">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Fichier joint</label>
                        <input type="text" id="article-file" class="form-control" placeholder="document.pdf (dans /files)">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Galerie Photos (Noms séparés par virgules)</label>
                    <input type="text" id="article-gallery" class="form-control" placeholder="photo1.jpg, photo2.jpg">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Texte de l'article</label>
                    <div id="editor" class="editor-container"></div>
                </div>
                <button onclick="addArticle()" class="btn btn-primary w-100 py-2 fw-bold">AJOUTER CET ARTICLE</button>
            </div>
        </div>

        <h3 class="mb-3">Historique des publications</h3>
        <ul id="admin-list" class="list-group shadow-sm"></ul>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="admin.js"></script>
</body>
</html>
